[package]
name = "esp-lan-ota"
description = "Verified, rollback-safe OTA updates for ESP32 Rust firmware, delivered over Matter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
## The Matter cluster for rs-matter 0.2 (`esp_lan_ota::matter`).
rs-matter-0-2 = ["dep:rs-matter", "dep:embassy-time"]

[dependencies]
embedded-storage = "0.3.1"
sha2 = { version = "0.10", default-features = false }

# Optional Matter glue. Versions follow what the firmware already links.
embassy-time = { version = "0.5", optional = true, default-features = false }
rs-matter = { version = "0.2", optional = true, default-features = false }

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
