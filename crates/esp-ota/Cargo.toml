[package]
name = "esp-ota"
description = "Enrolls ESP32 Matter devices into a private fabric and updates their firmware over the air"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "esp-ota"
path = "src/main.rs"

[dependencies]
esp-lan-ota = { path = "../esp-lan-ota", features = ["rs-matter-0-2"] }
rs-matter = "0.2"

anyhow = "1"
async-io = "2"
btleplug = "0.11"
clap = { version = "4", features = ["derive"] }
dirs = "6"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["std", "generic-queue-64"] }
env_logger = "0.11"
futures-lite = "2"
hex = "0.4"
log = "0.4"
mdns-sd = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serialport = { version = "4", default-features = false }
sha2 = "0.10"
socket2 = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
toml = "0.8"
uuid = "1"

[dev-dependencies]
embedded-storage = "0.3.1"
tempfile = "3"

[lints]
workspace = true
